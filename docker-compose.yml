services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=file:./data/dev.db
      - NODE_ENV=production
    volumes:
      - ./data/backend-db:/app/prisma/data
      - ./data/backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    restart: unless-stopped
